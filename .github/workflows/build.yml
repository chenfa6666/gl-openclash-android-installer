name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Windows 起源的仓库，gradlew 没有 Linux 可执行位；chmod 确保 ubuntu 能跑
      - name: Make gradlew executable
        run: chmod +x gradlew

      # ============== 正式版签名（仅当仓库 Secrets 配置了 SIGNING_KEYSTORE_BASE64 时生效） ==============
      # 没配置时 build.gradle.kts 自动兜底用 debug 签名，build 不会失败但 APK 不能升级安装。
      # 只要求 3 个 Secrets：SIGNING_KEYSTORE_BASE64 / SIGNING_PASSWORD / SIGNING_KEY_ALIAS（可选）
      - name: Decode signing keystore (if configured)
        env:
          SIGNING_KEYSTORE_BASE64: "${{ secrets.SIGNING_KEYSTORE_BASE64 }}"
          SIGNING_PASSWORD: "${{ secrets.SIGNING_PASSWORD }}"
          SIGNING_KEY_ALIAS: "${{ secrets.SIGNING_KEY_ALIAS }}"
        run: |
          # 如果没有配置 keystore base64，跳过此步，后续 gradle 会兜底用 debug 签名
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret configured. Skipping release signing. APK will be signed with debug key."
            exit 0
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "SIGNING_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "SIGNING_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          if [ -n "$SIGNING_KEY_ALIAS" ]; then
            echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          else
            echo "SIGNING_KEY_ALIAS=openclash" >> "$GITHUB_ENV"
          fi
          echo "Keystore decoded to $KEYSTORE_PATH (size: $(wc -c < "$KEYSTORE_PATH") bytes)"

      # 同时跑 debug（保险）和 release（主产物）
      - name: Build debug APK (sanity check)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK (minify + shrink + sign)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # R8 mapping
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: app-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
